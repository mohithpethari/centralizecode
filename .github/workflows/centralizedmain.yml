name: centralized_Code_Deploy

on:
  workflow_call:
    inputs:
      team:
        description: 'enter team name'
        type: string
        required: false
      environment:
        description: 'deploy to'
        type: string
        required: false
      source_path:
        description: 'Enter the source path(Local path) & use / for sub_path'
        required: false
        type: string
      destination_path:
        description: 'Enter the destination path & use / for sub_path'
        required: false
        type: string
      job_type:
        description: "please enter job type"
        type: string
      job:
        description: "please enter job file path"
        type: string
      code_deploy:
        type: boolean
        required: false
      workflow_job:
        type: boolean
        required: false
      deploy_config:
        type: boolean
        required: false
      Source_file:
        description: 'Enter the source path(Local path)'
        required: false
        type: string
      storage_container:
        description: 'Enter the destination path(/Remote path) for the storage account container'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  Approval-Request:
    if: always() && ( contains( inputs.environment, 'prod' ) )
    runs-on: [ opm-runner ]
    environment: ${{ inputs.team }}
    steps:
      - name: Approval Request
        shell: powershell
        run: |
          echo "Approval request sent to ${{ inputs.team }} team"

  Centralized_Databricks_Deployment:
    needs: Approval-Request
    if: always() && (needs.Approval-Request.result == 'success' || needs.Approval-Request.result == 'skipped')
    runs-on: [ opm-runner ]
    environment: ${{ inputs.environment }}
    env:
      NOTEBOOK_PATH: ${{ inputs.source_path }}
      DESTINATION_PATH: ${{ inputs.destination_path }}
      USERNAME: ${{ github.actor }}
      STORAGEACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      YAML_FILES: ${{ inputs.Source_file }}
      STORAGE_CONTAINER: ${{ inputs.storage_container }}
      DATABRICKS_HOST: ${{ vars.URL }}

    steps:

      - name: Add Git Bash to PATH
        shell: powershell
        run: |
          $gitBin = "C:\Program Files\Git\bin"
          $gitUsr = "C:\Program Files\Git\usr\bin"
          if (Test-Path $gitBin) {
            echo $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo $gitUsr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Git Bash found and added to PATH: $gitBin"
          } else {
            Write-Host "Git Bash not found - installing..."
            Invoke-WebRequest -Uri "https://github.com/git-for-windows/git/releases/download/v2.45.2.windows.1/Git-2.45.2-64-bit.exe" -OutFile "$env:TEMP\git.exe"
            Start-Process "$env:TEMP\git.exe" -Wait -ArgumentList '/VERYSILENT /NORESTART'
            echo $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo $gitUsr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Git Bash installed and added to PATH."
          }

      - name: Pipeline run information
        shell: powershell
        run: |
          Write-Host "This pipeline is triggered by ${{github.actor}}"
          Write-Host "Selected environment is ${{ inputs.environment }}"
          Write-Host "Selected team is ${{ inputs.team }}"
          Write-Host "Source file path is ${{ inputs.Source_file }}"
          Write-Host "Destination path is ${{ inputs.storage_container }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Install Azure CLI (Windows)
        shell: powershell
        run: |
          try {
            $azVersion = az --version 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Azure CLI already installed."
            } else {
              throw "az not found"
            }
          } catch {
            Write-Host "Azure CLI not found. Installing..."
            Invoke-WebRequest -Uri https://aka.ms/installazurecliwindows -OutFile AzureCLI.msi
            Start-Process msiexec.exe -Wait -ArgumentList '/I AzureCLI.msi /quiet'
            $azPath = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
            echo $azPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH += ";$azPath"
            Write-Host "Azure CLI installed successfully."
          }

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_SP_APPLICATION_ID }}
          tenant-id: ${{ secrets.AZURE_SP_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI script
        shell: powershell
        run: |
          az account show

      - name: Setup Databricks CLI
        shell: powershell
        run: |
          $version = "0.251.0"
          $url = "https://github.com/databricks/cli/releases/download/v$version/databricks_cli_${version}_windows_amd64.zip"
          $zipPath = "$env:TEMP\databricks.zip"
          $extractPath = "C:\databricks-cli"
          Write-Host "Downloading Databricks CLI v$version..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Write-Host "Adding to PATH..."
          echo $extractPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH += ";$extractPath"
          Write-Host "Verifying installation..."
          & "$extractPath\databricks.exe" --version

      - name: Configure Databricks CLI Auth
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SP_APPLICATION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Configuring Databricks CLI using Azure CLI auth..."

          # Write databrickscfg using azure auth mode - no token needed
          printf '[DEFAULT]\nhost = %s\nazure_client_id = %s\nazure_tenant_id = %s\nazure_use_msi = false\nazure_login_app_id = 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d\nauth_type = azure-cli\n' \
            "$DATABRICKS_HOST" \
            "$AZURE_CLIENT_ID" \
            "$AZURE_TENANT_ID" > ~/.databrickscfg

          echo "Databricks CLI configured."
          cat ~/.databrickscfg

          echo "Testing Databricks connection..."
          databricks workspace list / --profile DEFAULT
          echo "Databricks connection successful!"

      - name: Deploy to Databricks
        if: ${{ inputs.source_path != '' && inputs.destination_path != '' && inputs.team != '' && inputs.environment != '' }}
        shell: bash
        run: |
          dbx_deploy() {
            echo "################ Deploying $spath file ################"
            set -x
            case $spath in
              *.py)         lang="PYTHON"; format="";        strip_ext=true ;;
              *.ipynb)      lang="PYTHON"; format="JUPYTER"; strip_ext=true ;;
              *.sql)        lang="SQL";    format="";        strip_ext=true ;;
              *.r|*.R)      lang="R";      format="";        strip_ext=true ;;
              *.scala|*.sc) lang="SCALA";  format="";        strip_ext=true ;;
              *.html)       lang="";       format="HTML";    strip_ext=true ;;
              *)
                echo "Unsupported file type: $spath"
                return 1
                ;;
            esac
            if [[ -n $dpath ]]; then
              if [[ "$strip_ext" == "true" ]]; then
                dfilepath=${dpath%.*}
                sfilepath=${spath%.*}
              else
                dfilepath=$dpath
                sfilepath=$spath
              fi
              dir=$(dirname "$dpath")
              mv "$spath" "$sfilepath" 2>/dev/null || true
              databricks workspace mkdirs "/$dir" --profile DEFAULT 2>/dev/null || true
              if [[ -n "$format" ]]; then
                databricks workspace import "/$dfilepath" --file "$sfilepath" --format "$format" --language "$lang" --overwrite --profile DEFAULT
              else
                databricks workspace import "/$dfilepath" --file "$sfilepath" --language "$lang" --overwrite --profile DEFAULT
              fi
            else
              if [[ "$strip_ext" == "true" ]]; then
                filepath=${spath%.*}
              else
                filepath=$spath
              fi
              dir=$(dirname "$filepath")
              [[ "$dir" == "." ]] && dir=""
              mv "$spath" "$filepath" 2>/dev/null || true
              [[ -n "$dir" ]] && databricks workspace mkdirs "/$dir" --profile DEFAULT 2>/dev/null || true
              if [[ -n "$format" ]]; then
                databricks workspace import "/$filepath" --file "$filepath" --format "$format" --language "$lang" --overwrite --profile DEFAULT
              else
                databricks workspace import "/$filepath" --file "$filepath" --language "$lang" --overwrite --profile DEFAULT
              fi
            fi
            set +x
            echo "################ Deployment of $spath file is done ################"
          }

          dbx_deploy_dir() {
            echo "################ Deploying $spath directory ################"
            set -x
            if [[ -n $dpath ]]; then
              databricks workspace import-dir "$spath" "/$dpath" --overwrite --profile DEFAULT
            else
              databricks workspace import-dir "$spath" "/$spath" --overwrite --profile DEFAULT
            fi
            set +x
            echo "################ Deployment of $spath directory is done ################"
          }

          for i in $NOTEBOOK_PATH; do
            echo "$i" >> input1.txt
          done
          for j in $DESTINATION_PATH; do
            echo "$j" >> input2.txt
          done

          while read -r spath <&3 && read -r dpath <&4; do
            if [[ -f $spath ]]; then
              case $spath in
                *.py|*.ipynb|*.html|*.sql|*.r|*.R|*.scala|*.sc)
                  dbx_deploy
                  ;;
                *)
                  echo "$spath is not a compatible file format."
                  echo "$spath" >> error.txt
                  ;;
              esac
            elif [[ -d $spath ]]; then
              dbx_deploy_dir
            else
              echo "$spath is neither an available directory nor an available file."
              echo "Please recheck your inputs."
              echo "$spath" >> error.txt
            fi
          done 3< input1.txt 4< input2.txt

          rm -rf input1.txt input2.txt

      - name: Errors check
        shell: bash
        run: |
          if [[ -f error.txt ]]; then
            exit 1
          else
            echo "No Errors! All files are deployed successfully"
          fi

      - name: Errors
        if: failure()
        shell: bash
        run: |
          echo "Following files are not deployed due to some errors:"
          if [[ -f error.txt ]]; then
            cat error.txt
          fi
          echo "Please recheck your inputs."
          echo "Don't worry! All available files have been deployed successfully."

      - name: Install jq
        if: ${{ inputs.job_type != '' && inputs.job != '' && inputs.environment != '' }}
        shell: powershell
        run: |
          $jqPath = "C:\jq"
          New-Item -ItemType Directory -Force -Path $jqPath | Out-Null
          if (!(Test-Path "$jqPath\jq.exe")) {
            Invoke-WebRequest -Uri "https://github.com/jqlang/jq/releases/latest/download/jq-windows-amd64.exe" -OutFile "$jqPath\jq.exe"
          }
          echo $jqPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH += ";$jqPath"
          Write-Host "jq installed:"
          & "$jqPath\jq.exe" --version

      - name: Update existing Databricks workflow job
        if: ${{ inputs.job_type == 'Update_existing_job' && inputs.job != '' }}
        shell: bash
        run: |
          set -euo pipefail
          set -x
          for job in ${{ inputs.job }}; do
            if [[ -f "$job" ]]; then
              if ! jq . "$job" >/dev/null 2>&1; then
                echo "Invalid JSON in $job"
                continue
              fi
              jobname=$(jq -r '.name' "$job")
              echo "Processing job: $jobname"
              jobid=$(databricks jobs list --output JSON --profile DEFAULT | jq -r --arg name "$jobname" '.jobs[] | select(.settings.name==$name) | .job_id')
              if [[ -z "$jobid" ]]; then
                echo "No job found with name $jobname"
                continue
              fi
              echo "Resetting job ID: $jobid"
              sed -i 's/"runtime_engine": "PHOTON"/"runtime_engine": ""/Ig' "$job"
              databricks jobs reset --job-id "$jobid" --json-file "$job" --profile DEFAULT
              echo "Reset done for $jobid"
            elif [[ -d "$job" ]]; then
              files=$(find "$job" -type f -name "*.json")
              if [[ -z "$files" ]]; then
                echo "No JSON files found in directory $job"
                continue
              fi
              for file in $files; do
                if ! jq . "$file" >/dev/null 2>&1; then
                  echo "Invalid JSON in $file"
                  continue
                fi
                jobname=$(jq -r '.name' "$file")
                jobid=$(databricks jobs list --output JSON --profile DEFAULT | jq -r --arg name "$jobname" '.jobs[] | select(.settings.name==$name) | .job_id')
                if [[ -z "$jobid" ]]; then
                  echo "No job found with name $jobname"
                  continue
                fi
                echo "Resetting job ID: $jobid"
                sed -i 's/"runtime_engine": "PHOTON"/"runtime_engine": ""/Ig' "$file"
                databricks jobs reset --job-id "$jobid" --json-file "$file" --profile DEFAULT
                echo "Reset done for $jobid"
              done
            else
              echo "No valid file or directory found for $job"
            fi
          done

      - name: Create new workflow job
        if: ${{ inputs.job_type == 'Create_new_job' && inputs.job != '' && inputs.environment != '' }}
        shell: bash
        run: |
          set -x
          echo ${{ vars.WORKFLOWJOBPERMISSIONS }} > permissions.json
          sed -i "s/SPNAPPID/${{ secrets.AZURE_SP_APPLICATION_ID }}/g" permissions.json
          for job in ${{ inputs.job }}; do
            if [[ -f $job ]]; then
              jq . $job
              databricks jobs create --json @$job --profile DEFAULT > jobid.json
              cat jobid.json
              if [ -n "${{ vars.WORKFLOWJOBPERMISSIONS }}" ]; then
                jobidnum=$(jq '.job_id' jobid.json)
                echo "Assigning permissions to workflow job_id: $jobidnum"
                databricks jobs set-permissions $jobidnum --json @permissions.json --profile DEFAULT
              else
                echo "No permissions set"
              fi
            elif [[ -d $job ]]; then
              files=$(find "$job" -type f -name "*.json")
              for file in $files; do
                jq . $file
                databricks jobs create --json @$file --profile DEFAULT > jobid.json
                cat jobid.json
                if [ -n "${{ vars.WORKFLOWJOBPERMISSIONS }}" ]; then
                  jobidnum=$(jq '.job_id' jobid.json)
                  echo "Assigning permissions to workflow job_id: $jobidnum"
                  databricks jobs set-permissions $jobidnum --json @permissions.json --profile DEFAULT
                else
                  echo "No permissions set"
                fi
              done
            else
              echo "No job file found"
            fi
          done

      - name: Deploy config to storage account
        if: ${{ inputs.Source_file != '' && inputs.storage_container != '' && inputs.team != '' && inputs.environment != '' }}
        shell: bash
        run: |
          YAML_FILES="${{ inputs.Source_file }}"
          DEST_PATHS="${{ inputs.storage_container }}"
          IFS=',' read -ra SOURCES <<< "$YAML_FILES"
          IFS=',' read -ra DESTS <<< "$DEST_PATHS"
          for idx in "${!SOURCES[@]}"; do
            SOURCE_FILE=$(echo "${SOURCES[$idx]}" | xargs)
            DEST_CONTAINER=$(echo "${DESTS[$idx]}" | xargs | sed 's/^\s*//;s/\s*$//;s/\s*\/\s*/\//g')
            FILE_NAME=$(basename "$SOURCE_FILE")
            echo "Processing $FILE_NAME to $DEST_CONTAINER"
            az storage blob download --account-name "$STORAGEACCOUNT" --container-name "$DEST_CONTAINER" --name "$FILE_NAME" --file existingfile.yaml --auth-mode login 2>/dev/null || touch existingfile.yaml
            if ! cmp -s "$SOURCE_FILE" existingfile.yaml; then
              echo "Files are different or new. Uploading..."
              az storage blob upload --account-name "$STORAGEACCOUNT" --container-name "$DEST_CONTAINER" --file "$SOURCE_FILE" --name "$FILE_NAME" --auth-mode login --overwrite
              echo "File deployed successfully"
            else
              echo "Files are identical. No changes needed."
            fi
            rm -f existingfile.yaml
          done
